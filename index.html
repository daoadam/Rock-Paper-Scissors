<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple DOM example</title>
    <link rel = "stylesheet" href = "/RPS/styles.css">
    <script src = "/RPS/script.js" defer></script>
</head>
<body>


<section class = "intro">
<div>
    <h1>Welcome to the Rock, Paper, Scissors Games!</h1>
    <h3>Choose your attack!</h3>
</div>
</section>
<section class = "options">

    <div class = "rock">
        <p>Rock</p>
    </div>

    <div class = "paper">
        <p>Paper</p>
    </div>

    <div class = "scissors">
        <p>Scissors</p>
    </div>


</section>

<section class = "outcome">
<div>
    <p class = "current-round"></p>
    <p class = "running-score"></p>
    <p class = "winner"></p>
</div>

</section>

</body>
</html>
